[project]
name = "owie"
version = "0.0.0"
description = "Contextual activation suppression in agent loops — measurement harness"
requires-python = "==3.12.*"

# Pinned exactly. Every version here can change numerical behaviour.
# See PREFLIGHT.md §9. Checkpoint 1 deliberately depends on nothing that
# requires model weights.
dependencies = [
    "torch==2.13.0",
    "safetensors==0.8.0",
    "numpy==2.5.2",
    "transformers==5.15.1",
    "tokenizers==0.22.2",
    "accelerate==1.14.0",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.4",
    "anyio==4.14.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.165.10",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["interventions", "directions", "server", "evals", "analysis", "loop", "replay"]

[project.scripts]
inspect-spans = "server.inspect_spans:main"
owie-server = "server.__main__:main"
owie-build-datasets = "evals.build_datasets:main"
owie-phase0 = "evals.sweep:main"
owie-phase0-analyse = "analysis.phase0:main"
owie-loop = "loop.__main__:main"
owie-replay-prefixes = "replay.prefixes:main"
owie-replay-calibrate = "replay.calibration:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
